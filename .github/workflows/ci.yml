name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    # GitHub-hosted on purpose: self-hosted runners must not pick up
    # pull_request jobs from a public repo — fork PRs run arbitrary code.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, sqlite, pdo_sqlite, bcmath, intl, zip
          coverage: none

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Copy environment file
        run: cp .env.example .env

      - name: Generate application key
        run: php artisan key:generate

      - name: Generate Passport OAuth keys
        run: php artisan passport:keys --force

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install npm dependencies and build assets
        run: |
          npm ci
          npm run build

      - name: Run tests
        run: php artisan test
