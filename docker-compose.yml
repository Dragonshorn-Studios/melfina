services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: ${APP_URL:-http://localhost:8000}
      DB_CONNECTION: sqlite
      DB_DATABASE: /data/database.sqlite
      SESSION_DRIVER: database
      LOG_CHANNEL: stderr
      PASSPORT_KEYS_DIR: /data/passport
      # Comma-separated redirect allow-list for OAuth DCR (custom schemes
      # claude/cursor/vscode/chatgpt-desktop are always permitted).
      MCP_REDIRECT_DOMAINS: ${MCP_REDIRECT_DOMAINS:-http://localhost,http://127.0.0.1}
    volumes:
      - melfina-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/up"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  melfina-data:
